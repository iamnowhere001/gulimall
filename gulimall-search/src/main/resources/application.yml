server:
  port: 12000

spring:
  application:
    name: gulimall-search
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
    sentinel:
      enabled: false
  redis:
    host: localhost
    port: 6379
  thymeleaf:
    cache: false
  session:
    store-type: redis

feign:
  sentinel:
    enabled: false

logging:
  level:
    com.xunqi.gulimall.search: debug
    root: warn
  pattern:
    console: "%d{yyyy-MM-dd} [%thread] - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: '*'
