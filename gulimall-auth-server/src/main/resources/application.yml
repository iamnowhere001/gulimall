server:
  port: 8150
  servlet:
    session:
      timeout: 30m

spring:
  application:
    name: gulimall-auth-server
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
    # Sentinel 默认关闭（无 dashboard 时不启用）
    sentinel:
      enabled: false
  redis:
    host: localhost
    port: 6379
  thymeleaf:
    cache: false
  # 登录会话存 Redis
  session:
    store-type: redis

feign:
  sentinel:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: '*'
