<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <title>商品已成功加入购物车</title>
    <link rel="stylesheet" type="text/css" href="/static/cart/css/success.css"/>
</head>
<body>
<!-- 顶部导航 -->
<header>
    <div class="header_head">
        <div class="header_head_box">
            <a href="http://gulimall.com" class="header_head_p_a1">谷粒商城首页</a>
            <ul>
                <li>
                    <a th:if="${session.loginUser == null}" href="http://auth.gulimall.com/login.html">你好，请登录</a>
                    <a th:if="${session.loginUser != null}">欢迎, [[${session.loginUser.nickname}]]</a>
                </li>
                <li>
                    <a th:if="${session.loginUser == null}" href="http://auth.gulimall.com/reg.html" class="register-link">免费注册</a>
                </li>
                <span>|</span>
                <li><a href="http://order.gulimall.com/list.html">我的订单</a></li>
            </ul>
        </div>
    </div>
</header>

<!-- 搜索栏 -->
<div class="header_sous">
    <div class="header_form">
        <a href="http://gulimall.com/" class="logo">
            <img src="/static/cart/img/logo1.jpg" alt="谷粒商城"/>
        </a>
        <div class="search-box">
            <input type="text" id="searchText" placeholder="搜索你想要的商品">
            <button onclick="search()">搜索</button>
        </div>
    </div>
</div>

<!-- 主体内容 -->
<div class="main">
    <div class="success-card" th:if="${cartItem != null}">
        <div class="success-icon">
            <svg viewBox="0 0 64 64" width="64" height="64">
                <circle cx="32" cy="32" r="30" fill="#e4393c" opacity="0.1"/>
                <circle cx="32" cy="32" r="24" fill="#e4393c"/>
                <path d="M20 32 L28 40 L44 24" stroke="white" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>
        <h2 class="success-title">商品已成功加入购物车</h2>

        <div class="product-info">
            <div class="product-img">
                <img th:src="${cartItem.image}" alt=""/>
            </div>
            <div class="product-detail">
                <a class="product-name" th:href="'http://item.gulimall.com/'+${cartItem.skuId}+'.html'"
                   th:text="${cartItem.title}">商品名称</a>
                <div class="product-meta">
                    <span class="product-count" th:text="'数量：'+${cartItem.count}">数量：1</span>
                </div>
            </div>
        </div>

        <div class="action-btns">
            <a class="btn-back" th:href="'http://item.gulimall.com/'+${cartItem.skuId}+'.html'">查看商品详情</a>
            <a class="btn-cart" href="http://cart.gulimall.com/cart.html">去购物车结算</a>
        </div>
    </div>

    <div class="success-card empty" th:if="${cartItem == null}">
        <div class="success-icon">
            <svg viewBox="0 0 64 64" width="64" height="64">
                <circle cx="32" cy="32" r="30" fill="#ccc" opacity="0.2"/>
                <circle cx="32" cy="32" r="24" fill="#999"/>
                <path d="M22 22 L42 42 M42 22 L22 42" stroke="white" stroke-width="4" fill="none" stroke-linecap="round"/>
            </svg>
        </div>
        <h2 class="success-title">购物车中无此商品</h2>
        <a class="btn-cart" href="http://gulimall.com/">去购物</a>
    </div>
</div>

<script type="text/javascript">
    function search() {
        var keyword = document.getElementById("searchText").value.trim();
        if (!keyword) {
            alert("请输入搜索关键词");
            return;
        }
        window.location.href = "http://search.gulimall.com/list.html?keyword=" + encodeURIComponent(keyword);
    }

    document.getElementById("searchText").addEventListener("keypress", function(e) {
        if (e.key === "Enter") {
            search();
        }
    });
</script>
</body>
</html>
