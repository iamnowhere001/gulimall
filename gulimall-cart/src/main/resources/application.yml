server:
  port: 40000

spring:
  application:
    name: gulimall-cart
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
    sentinel:
      enabled: false
  redis:
    host: localhost
    port: 6379
  session:
    store-type: redis

feign:
  sentinel:
    enabled: false

# 购物车业务线程池
gulimall:
  thread:
    coreSize: 20
    maxSize: 200
    keepAliveTime: 10

management:
  endpoints:
    web:
      exposure:
        include: '*'
