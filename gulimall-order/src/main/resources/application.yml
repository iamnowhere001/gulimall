server:
  port: 9000

spring:
  application:
    name: gulimall-order
  datasource:
    username: root
    password: root
    url: jdbc:mysql://localhost:3306/gulimall_oms?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver

  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848

    sentinel:
      enabled: false
      transport:
        #配置sentinel dashboard地址
        dashboard: localhost:8080
      filter:
        enabled: false

  redis:
    host: localhost
    port: 6379

  # 禁用 Sleuth 异步包装，防止 ThreadPoolExecutor 被包装为 TraceableExecutorService
  sleuth:
    async:
      enabled: false
    sampler:
      probability: 0

#开启feign对sentinel的支持
feign:
  sentinel:
    enabled: false

  session:
    store-type: redis

mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml

  #\u8BBE\u7F6E\u5B9E\u4F53\u7C7B\u7684\u81EA\u589E\u4E3B\u952E
  global-config:
    db-config:
      id-type: auto



