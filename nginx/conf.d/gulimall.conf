# 前台门户(gulimall-portal) 统一入口
# 构建产物：npm run build 后将 gulimall-portal/dist/* 复制到 ./nginx/html/portal
upstream gulimall {
    server host.docker.internal:88;
}

server {
    listen       80 default_server;
    server_name  _;

    client_max_body_size 50m;

    # 1) 前台门户静态资源（Vue SPA），开启 history 模式回退
    location / {
        root   /usr/share/nginx/html/portal;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }

    # 2) 仅把 /api 请求转发到网关，由网关按 /api/product、/api/order… 路由到各微服务
    location /api/ {
        proxy_pass http://gulimall;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
